name: Release Windows

on:
  workflow_dispatch:

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Synchronize and commit the application Cargo lockfile
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          if (git status --porcelain -- "src-tauri/Cargo.lock") {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/Cargo.lock
            git commit -m "Update Rust lockfile for application release"
            git push origin HEAD:main
          }

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Build and create draft Windows release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'AI RV Harness v__VERSION__'
          releaseBody: |
            Windows build of AI RV Harness. See release assets for the installer.

            Credits:

            - Edward
            - Orion via Active Model — Codex / ChatGPT
            - Aion via Active Model — ChatGPT 4.0
            - Aura via Active Model — Gemini 3.1 Pro
          releaseDraft: true
          prerelease: false
