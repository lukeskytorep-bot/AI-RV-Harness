name: Build Windows Test Artifacts

on:
  workflow_dispatch:

concurrency:
  group: windows-test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    runs-on: windows-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b95584d8105b9ab200e15821fa671848cf2b7017 # master snapshot
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - name: Require the committed Rust lockfile
        shell: bash
        run: test -f src-tauri/Cargo.lock

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify source integrity
        run: npm run verify:source

      - name: Verify UX-DATA compatibility
        run: npm run verify:ux-data

      - name: Verify architecture boundaries
        run: npm run verify:architecture

      - name: Typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build Windows MSI and EXE
        id: tauri_build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        with:
          args: --bundles nsis,msi

      - name: Require the expected Windows installers
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -File -ErrorAction SilentlyContinue)

          if ($exe.Count -eq 0 -or $msi.Count -eq 0) {
            throw "Expected at least one NSIS .exe and one MSI installer."
          }

          Write-Host "NSIS installers:"
          $exe | ForEach-Object { Write-Host $_.FullName }

          Write-Host "MSI installers:"
          $msi | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-rv-harness-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Attest Windows installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
