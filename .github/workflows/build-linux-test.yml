name: Build Linux Test Artifacts

on:
  push:
    branches:
      - ai-rv-2
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-linux-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b95584d8105b9ab200e15821fa671848cf2b7017 # master snapshot
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'
      - name: Require the committed Rust lockfile
        run: test -f src-tauri/Cargo.lock
      - run: npm ci
      - run: npm run verify:source
      - run: npm run verify:ux-data
      - run: npm run verify:architecture
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: npm run verify:openrouter-continuation-bridge
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build AppImage and Debian test packages
        run: npm run tauri -- build --bundles appimage,deb
      - name: Require the expected Linux test packages
        run: |
          compgen -G 'src-tauri/target/release/bundle/appimage/*.AppImage' > /dev/null
          compgen -G 'src-tauri/target/release/bundle/deb/*.deb' > /dev/null
      - name: Attest Linux test packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
      - name: Upload Linux test packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ai-rv-harness-linux-test-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
