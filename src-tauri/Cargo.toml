[package]
name = "ai-rv-harness"
version = "0.7.1"
description = "AI RV Harness desktop application"
authors = ["AI RV Harness contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "ai_rv_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
